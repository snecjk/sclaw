<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SClaw</title>
    <style>
      /* Critical: Set background immediately to match the native window */
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        color-scheme: light;
        min-height: 100vh;
      }

      /* Splash screen styles - shown immediately before React loads */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-artwork {
        position: absolute;
        left: 0;
        top: -7.1429%;
        width: 100%;
        height: 107.1429%;
        object-fit: fill;
      }
      /* Hide splash when React takes over */
      #splash-screen.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen shown instantly while app loads -->
    <div id="splash-screen">
      <img class="splash-artwork" src="/src/assets/auth/loading.svg" alt="SClaw 正在加载" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
