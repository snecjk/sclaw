<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SClaw</title>
    <style>
      /* Critical: Set background immediately to match the native window */
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        color-scheme: light;
        min-height: 100vh;
      }

      /* Splash screen styles - shown immediately before React loads */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-artwork {
        position: absolute;
        left: 0;
        top: -7.1429%;
        width: 100%;
        height: 107.1429%;
        object-fit: fill;
      }
      .splash-progress-track {
        position: absolute;
        left: 40.139%;
        top: 51.667%;
        width: 19.653%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e6eb;
      }
      .splash-progress-bar {
        width: 8%;
        height: 100%;
        border-radius: 999px;
        background: #1d2129;
        animation: splash-progress-warmup 6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transition: width 0.45s ease-out;
      }
      @keyframes splash-progress-warmup {
        from { width: 8%; }
        to { width: 72%; }
      }
      /* Hide splash when React takes over */
      #splash-screen.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen shown instantly while app loads -->
    <div id="splash-screen">
      <img class="splash-artwork" src="/src/assets/auth/loading.svg" alt="SClaw 正在加载" />
      <div class="splash-progress-track" aria-hidden="true">
        <div id="splash-progress-bar" class="splash-progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Drive the loading artwork progress from Main-process stages.
      if (window.electron && window.electron.ipcRenderer) {
        const stageProgress = {
          'Loading settings...': 18,
          'Preparing workspace...': 38,
          'Installing plugins...': 62,
          'Starting Gateway...': 82,
          'Finalizing...': 96,
        };
        window.electron.ipcRenderer.on('startup-progress', (_event, message) => {
          const progressBar = document.getElementById('splash-progress-bar');
          if (!progressBar) return;
          const trackWidth = progressBar.parentElement?.clientWidth || 1;
          const currentProgress = (progressBar.getBoundingClientRect().width / trackWidth) * 100;
          const nextProgress = stageProgress[message] || 12;
          progressBar.style.animation = 'none';
          progressBar.style.width = `${Math.max(currentProgress, nextProgress)}%`;
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
