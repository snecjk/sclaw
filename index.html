<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SClaw</title>
    <style>
      /* Critical: Set background immediately to match the native window */
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        color-scheme: light;
        min-height: 100vh;
      }

      /* Splash screen styles - shown immediately before React loads */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-artwork {
        position: absolute;
        left: 50%;
        top: 50%;
        width: max(100vw, 160vh);
        height: max(100vh, 62.5vw);
        transform: translate(-50%, -50%);
        object-fit: fill;
      }
      /* Hide splash when React takes over */
      #splash-screen.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen shown instantly while app loads -->
    <div id="splash-screen">
      <img class="splash-artwork" src="/src/assets/auth/loading.svg" alt="SClaw 正在加载" />
    </div>
    <script>
      // 以 SVG 真正加载完成的时刻作为 0% 起点，确保走满后才切页。
      const splashArtwork = document.querySelector('.splash-artwork');
      const markSplashStarted = () => {
        if (window.__SCLAW_SPLASH_STARTED_AT__) return;
        window.__SCLAW_SPLASH_STARTED_AT__ = Date.now();
        window.dispatchEvent(new Event('sclaw-splash-started'));
      };
      // Electron 会缓存 <img> 内的 SVG 动画时间轴，Ctrl+R 后直接复用会停在 100%。
      // 每次文档加载都换一个仅用于本次启动的 URL，强制 SVG 时间轴从 0 重建。
      const splashUrl = new URL(splashArtwork.src);
      splashUrl.searchParams.set(
        'splash-run',
        `${Date.now()}-${Math.random().toString(36).slice(2)}`,
      );
      const expectedSplashUrl = splashUrl.href;
      const handleSplashLoad = () => {
        if (splashArtwork.src !== expectedSplashUrl) return;
        splashArtwork.removeEventListener('load', handleSplashLoad);
        markSplashStarted();
      };
      splashArtwork.addEventListener('load', handleSplashLoad);
      splashArtwork.src = expectedSplashUrl;
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
