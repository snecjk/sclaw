<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SClaw</title>
    <style>
      /* Critical: Set background immediately to match the native window */
      html, body {
        margin: 0;
        padding: 0;
        background: #ededed;
        color-scheme: light;
        min-height: 100vh;
      }
      
      /* Splash screen styles - shown immediately before React loads */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ededed;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
      }
      .splash-text {
        color: #4e5969;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .splash-spinner {
        margin-top: 24px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(29, 33, 41, 0.1);
        border-top-color: rgba(167, 139, 250, 0.7);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .splash-progress {
        margin-top: 16px;
        color: #86909c;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        min-height: 18px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background: #0d0d0d;
          color-scheme: dark;
        }
        #splash-screen {
          background: #0d0d0d;
        }
        .splash-text {
          color: rgba(255, 255, 255, 0.7);
        }
        .splash-progress {
          color: rgba(255, 255, 255, 0.5);
        }
        .splash-spinner {
          border-color: rgba(255, 255, 255, 0.1);
        }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Hide splash when React takes over */
      #splash-screen.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen shown instantly while app loads -->
    <div id="splash-screen">
      <svg class="splash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="rgba(167, 139, 250, 0.6)" stroke-width="4" fill="rgba(255, 255, 255, 0.05)"/>
        <path d="M30 50 L45 65 L70 35" stroke="rgba(167, 139, 250, 0.8)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="splash-text">SClaw</div>
      <div class="splash-spinner"></div>
      <div id="splash-progress" class="splash-progress"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Listen for startup progress updates from main process (before React loads)
      // This provides immediate feedback during the critical first-launch period
      if (window.electron && window.electron.ipcRenderer) {
        window.electron.ipcRenderer.on('startup-progress', (event, message) => {
          const progressEl = document.getElementById('splash-progress');
          if (progressEl) {
            progressEl.textContent = message || '';
          }
        });
      }
    </script>
  </body>
</html>
