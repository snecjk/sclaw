<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SClaw</title>
    <style>
      /* Critical: Set background immediately to match the native window */
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        color-scheme: light;
        min-height: 100vh;
      }

      /* Splash screen styles - shown immediately before React loads */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-artwork {
        position: absolute;
        left: 0;
        top: -7.1429%;
        width: 100%;
        height: 107.1429%;
        object-fit: fill;
      }
      /* 画布(1440x900, 裁顶 60px)到窗口是 object-fill 非等比缩放,
         进度条用设计稿像素定位 + 反向 scale 抵消拉伸, 与画中轨道逐像素重合。
         画中轨道: x 578-861 / y 494-497(约 4px)。 */
      .splash-progress-track {
        position: absolute;
        left: 0;
        top: 0;
        width: 283px;
        height: 4px;
        background: #e5e6eb;
        border-radius: 999px;
        overflow: hidden;
        transform-origin: 0 0;
        transform: translate(calc(578 * 100vw / 1440), calc(434 * 100vh / 840))
                   scale(calc(100vw / 1440), calc(100vh / 840));
      }
      /* 深色填充条: 初始一小段持续来回滑动(动效), 主进程阶段事件推高后停止滑动 */
      .splash-progress-bar {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 28px;
        border-radius: 999px;
        background: #1d2129;
        transition: width 0.5s ease-out;
        animation: splash-slide 1.6s ease-in-out infinite;
      }
      .splash-progress-bar.settled {
        animation: none;
        width: 8%;
      }
      @keyframes splash-slide {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(255px); } /* 283 - 28 = 255, 在轨道内来回扫 */
      }
      /* Hide splash when React takes over */
      #splash-screen.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen shown instantly while app loads -->
    <div id="splash-screen">
      <img class="splash-artwork" src="/src/assets/auth/loading.svg" alt="SClaw 正在加载" />
      <div class="splash-progress-track" aria-hidden="true">
        <div id="splash-progress-bar" class="splash-progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Drive the loading artwork progress from Main-process stages.
      if (window.electron && window.electron.ipcRenderer) {
        const stageProgress = {
          'Loading settings...': 18,
          'Preparing workspace...': 38,
          'Installing plugins...': 62,
          'Starting Gateway...': 82,
          'Finalizing...': 96,
        };
        window.electron.ipcRenderer.on('startup-progress', (_event, message) => {
          const progressBar = document.getElementById('splash-progress-bar');
          if (!progressBar) return;
          // 收到真实阶段后停止滑动, 转为按百分比增长的进度条
          progressBar.classList.add('settled');
          const nextProgress = stageProgress[message] || 12;
          const currentProgress = parseFloat(progressBar.style.width) || 8;
          progressBar.style.width = `${Math.max(currentProgress, nextProgress)}%`;
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
