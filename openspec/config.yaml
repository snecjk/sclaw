schema: spec-driven

context: |
  StoClaw is a cross-platform Electron desktop app (React 19 + Vite + TypeScript) providing a GUI for the OpenClaw AI agent runtime.

  Tech stack:
  - Electron (Main + Renderer)
  - React 19, Vite, TypeScript
  - pnpm (pinned version in packageManager field)
  - Tailwind CSS, shadcn/ui components
  - Zustand for state management (src/stores/)
  - Vitest for unit tests, Playwright for E2E

  Key directories:
  - src/pages/: Page-level components (Home, Agents, Channels, Chat, Cron, FloatIcon, Login, Models, Settings, Setup, Skills, Sprite, Subscriptions)
  - src/components/: Shared components (channels, common, layout, settings, ui)
  - src/stores/: Zustand stores (agents, auth, channels, chat, cron, gateway, message-queue, providers, settings, skills, subscriptions, update)
  - src/hooks/: Custom React hooks
  - src/lib/: Host API and API client (single entry for backend calls)
  - electron/main/: Main process code (window management, IPC, tray, updater, proxy)
  - electron/services/: Main process services (client-update-platform, providers, secrets, sto-biz-agent-sync, sto-skill-service, sto-subscription-service, sto-token-quota-service, provider-migration, provider-runtime-sync, provider-service, provider-store, provider-validation, sto-model-sync, store-instance, secret-store)
  - electron/preload/: Preload scripts
  - electron/shared/: Shared types between Main and Renderer
  - electron/api/: API definitions
  - openspec/: OpenSpec change management
  - docs/sto-design.md: STO UI theme constitution — brand, functional, neutral colors, token naming (Foundation→Property→Modifier); single source of truth for page/shell theming in specs and implementation.

  Business module mapping (capability naming reference):
  - Chat page → chat-* (e.g., chat-message-sync, chat-file-attachment)
  - Channels page → channels-* (e.g., channels-list, channels-message-sync)
  - Agents page → agents-* (e.g., agents-list, agents-config)
  - Settings page → settings-* (e.g., settings-ai-provider, settings-appearance)
  - Models page → models-* (e.g., models-usage-chart, models-filter)
  - Skills page → skills-* (e.g., skills-marketplace, skills-install)
  - Subscriptions page → subscriptions-* (e.g., subscriptions-plan, subscriptions-billing)
  - Login page → login-* (e.g., login-oauth, login-qr)
  - Cron page → cron-* (e.g., cron-schedule, cron-history)
  - Setup page → setup-* (e.g., setup-wizard, setup-onboarding)
  - FloatIcon → float-icon-* (e.g., float-icon-position, float-icon-animation)
  - Sprite → sprite-* (e.g., sprite-animation, sprite-interaction)
  - Main process services → service-* (e.g., service-provider-sync, service-secret-store)
  - IPC/Host API → host-api-* (e.g., host-api-proxy, host-api-auth)
  - Cross-cutting concerns → semantic names (e.g., realtime-message-delivery, auth-session-management, provider-model-sync)

  Domain: AI agent runtime GUI with multi-provider support, real-time messaging, skills marketplace, subscription management.

rules:
  proposal:
    - Capabilities MUST use business-module-aligned kebab-case names (e.g., `chat-message-sync`, NOT `frontend-chat-component`)
    - Cross-cutting capabilities MUST use semantic concern names (e.g., `realtime-message-delivery`, NOT `chat-and-channels-update`)
    - Keep proposals under 2 pages; focus on WHY not HOW
    - Always include explicit New Capabilities and Modified Capabilities lists
    - If the change materially affects user-visible page or shell theming, the proposal SHOULD note alignment with docs/sto-design.md (STO theme constitution)
    - Any user-visible UI change MUST explicitly include dark-mode compatibility in scope; a change is incomplete if dark mode is omitted

  design:
    - Every key decision MUST include rationale and at least one alternative considered
    - Document risks with [Risk] → Mitigation format
    - Keep design focused on architecture, not line-by-line implementation
    - UI or shell appearance decisions (colors, emphasis, status hues, typography contrast) MUST align with docs/sto-design.md; cite that document or its token names (e.g., Brand-6, Grey-10) instead of ad-hoc hex-only descriptions
    - UI designs MUST specify dark-mode behavior, use semantic theme tokens for foreground/background/border, and MUST NOT introduce light-only hardcoded fills such as `bg-white` without a dark-mode token or variant

  specs:
    - Every requirement MUST use SHALL or MUST for normative statements
    - Every requirement MUST have at least one scenario with exactly four hashtags (`#### Scenario:`)
    - Renderer-visible theming requirements (page chrome, primary actions, success/warning/danger/info semantics) MUST be stated in terms consistent with docs/sto-design.md (semantic tokens / Property categories); arbitrary hex in requirements is discouraged except when quoting the canonical palette from that doc
    - Every new or modified renderer-visible UI requirement MUST include dark-mode acceptance coverage, including readable text, appropriate semantic backgrounds, borders, focus, hover, selected, and disabled states where applicable
    - Scenarios MUST use `- **WHEN**` and `- **THEN**` format
    - For MODIFIED requirements, copy the ENTIRE requirement block from the existing spec before editing
    - DO NOT add direct `window.electron.ipcRenderer.invoke(...)` calls in pages/components; use host-api instead
    - DO NOT call Gateway HTTP endpoints directly from renderer; use Main-process proxy channels (`hostapi:fetch`, `gateway:httpProxy`)
    - Transport policy is Main-owned and fixed as `WS -> HTTP -> IPC fallback`; renderer MUST NOT implement protocol switching logic

  plugins:
    - "New or modified OpenClaw local plugins under `sto-plugin/openclaw/` MUST be registered in BOTH packaging scripts - `scripts/bundle-openclaw-plugins.mjs` (`PLUGINS` array) AND `scripts/after-pack.cjs` (`BUNDLED_PLUGINS` array). Missing either causes the plugin to exist in `build/openclaw-plugins/` but be absent from packaged installs."
    - "The above packaging scripts are engineering-owned build scripts; AI SHALL NOT modify them automatically. Tasks MUST instruct users to update them manually or request review from the engineering owner."

  tasks:
    - Each task MUST reference the corresponding `### Requirement:` name from spec.md for traceability
    - For communication-related changes (gateway events, runtime send/receive, delivery, fallback), run `pnpm run comms:replay` and `pnpm run comms:compare`
    - After functional changes, review `README.md`, `README.zh-CN.md`, and `README.ja-JP.md` for required updates; update docs in the same PR/commit
    - UI implementation tasks MUST include dark-mode verification and MUST check changed components for hardcoded light-only colors
    - Tasks MUST be grouped under numbered headings (e.g., `## 1. Group Name`)
    - Each task MUST use checkbox format (markdown list items like "- [ ] X.Y Task description")
