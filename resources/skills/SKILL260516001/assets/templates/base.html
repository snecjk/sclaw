<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周会PPT - {{stat_date}}</title>
    <style>
        {{common_css}}
    </style>
</head>
<body>
    <div class="ppt-container" contenteditable="true">
        {{slides}}
    </div>
    
    <!-- 页面导航 -->
    <div class="nav-panel">
        <div class="nav-title">周会PPT</div>
        <div class="nav-pages">
            {{nav_items}}
        </div>
        <div class="nav-info">
            第 <span id="current-page">1</span> / <span id="total-pages">{{total_pages}}</span> 页
        </div>
    </div>
    
    <script>
        // 滚动监听，更新当前页码
        const slides = document.querySelectorAll('.slide');
        const currentPageEl = document.getElementById('current-page');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id.replace('slide-', '');
                    currentPageEl.textContent = id;
                }
            });
        }, { threshold: 0.5 });
        
        slides.forEach(slide => observer.observe(slide));
        
        // 导航点击跳转
        document.querySelectorAll('.nav-page-item').forEach(item => {
            item.addEventListener('click', () => {
                const targetId = item.getAttribute('data-target');
                document.getElementById(targetId).scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
