<title>STO 空状态组件库 · sto-empty</title>
<!-- STO 自有空态插画(6 场景),供 sto-distinctive-design skill 调用。★仅在报告需要空态时才打开本文件(插画体积大)。
     用法:复制对应 .sto-empty 块进报告(SVG 已内联、保留品牌橙灰);需操作时配 sto-btn。空态克制:居中插画+文案+(可选)操作,别铺大。 -->
<style>
:root{--text:#1D2129;--text-3:#86909C;--text-disabled:#C9CDD4;--border:#E5E6EB;--brand:#FF6700;--brand-hover:#FF852E;
 --bg:#F5F7FA;--surface:#fff;--r-md:6px;--font:'PingFang SC','Source Han Sans SC','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:24px}
.h{font-size:20px;font-weight:600;margin-bottom:2px}.sub{font-size:12px;color:var(--text-3);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.sto-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;gap:8px}
.sto-empty__art{width:200px;max-width:100%}
.sto-empty__art svg{width:100%;height:auto;display:block}
.sto-empty__t{font-size:14px;color:var(--text-3);margin-top:4px}
.sto-empty__d{font-size:12px;color:var(--text-disabled)}
.sto-empty__act{margin-top:6px}
.sto-btn{display:inline-flex;align-items:center;gap:6px;font:500 14px/22px var(--font);min-height:32px;padding:6px 14px;border-radius:var(--r-md);border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;transition:.15s}
.sto-btn:hover{background:var(--brand);color:#fff}
.note{font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.6}
.sto-empty__link{display:inline-block;color:var(--brand);font:500 14px/22px var(--font);cursor:pointer}.sto-empty__link:hover{text-decoration:underline}</style></head><body>
