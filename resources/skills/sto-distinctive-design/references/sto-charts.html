<meta charset="UTF-8" />

<title>STO 图表组件库 · sto-charts</title>
<!--
  STO 图表可视化组件库（供 sto-distinctive-design skill 调用）
  来源：STO视觉品牌生成式/图表可视化（10 份设计 PDF + 规范 MD）
  用法见同目录 README.md。三种调用方式：
   ① 数据驱动：复制下方 <style> + <script> 两块到报告，调 stoLine(可 step/smooth)/stoArea(可 stacked)/stoColumn(可 stacked)/stoCombo/stoBar(可 grouped/stacked)/stoDonut/stoPie/stoRadar/stoBubble/stoMap(中国省级热力)/stoFunnel(漏斗)/stoTooltip(挂载点, 配置)
   ② 静态 SVG：直接抄某图渲染出的 SVG 片段
   ③ Tooltip / 图例：抄对应 class 的 HTML
  所有颜色走 STO 图表色板，禁自创色；CSS 变量带 fallback,可独立运行也可继承报告 :root。
-->
<style>
:root{
  /* ── STO 图表分类色板 Set1（主色阶,按序用）── */
  --c-1:#FF6700; --c-2:#005BE5; /* A1/B1 已对齐品牌橙/辅助蓝(与报告一致);C1+ 保留图表分类色 */ --c-3:#20B87C; --c-4:#FFB12E; --c-5:#9480FF; --c-6:#FF4D4D; --c-7:#89BE12;
  /* ── Set2（扩展浅色阶,Set1 用完接续）── */
  --c-1b:#F9D9C4; --c-2b:#D6DBFF; --c-3b:#D9ECE4; --c-4b:#F9D18F; --c-5b:#C2B9F9; --c-6b:#FAD4D4; --c-7b:#D6E4BA;
  /* ── 语义色 ── */
  --ch-pos:#12BE2F; --ch-warn:#FFB12E; --ch-neg:#FF4D4D; --ch-info:#005BE5;
  /* ── 图表中性 ── */
  --ch-title:#1C2029; --ch-text:#333333; --ch-text2:#585858; --ch-text3:#868F9C;
  --ch-line:#D8D8D8; --ch-grid:#ECECEC; --ch-bg:#FFFFFF; --ch-bg-soft:#F6F6F6;
  --ch-radius:12px; --ch-radius-sm:4px; --ch-font:'PingFang SC','Source Han Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --ch-num:'D-DIN','DIN Alternate','Bahnschrift','PingFang SC',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fa;color:var(--ch-text);font-family:var(--ch-font);padding:24px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.page-h{font-size:20px;font-weight:600;color:var(--ch-title);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--ch-text3);margin-bottom:20px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

/* ══════════ 图表通用容器 ══════════ */
.sto-chart{background:var(--ch-bg);border:1px solid #E5E6EB;border-radius:var(--ch-radius);padding:18px 20px}
.sto-chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.sto-chart-title{font-size:16px;font-weight:600;color:var(--ch-title)}
.sto-chart-sub{font-size:12px;color:var(--ch-text3)}
.sto-chart svg{display:block;width:100%;height:auto;overflow:visible}
/* 坐标轴 / 网格 / 文字 */
.sto-ax-grid{stroke:var(--ch-grid);stroke-width:1}
.sto-ax-line{stroke:var(--ch-line);stroke-width:1}
.sto-ax-text{font-family:var(--ch-font);font-size:12px;fill:var(--ch-text3)}
.sto-ax-text.num{font-family:var(--ch-num)}
.sto-val-text{font-family:var(--ch-num);font-size:12px;fill:var(--ch-text)}
.sto-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sto-dot{stroke:#fff;stroke-width:1.5}
/* 图例 */
.sto-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.sto-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ch-text2)}
.sto-legend-item i{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ══════════ 环形图 ══════════ */
.sto-donut-body{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.sto-donut-svg{flex:0 0 168px;width:168px;height:168px}
.sto-donut-legend{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px}
.sto-donut-li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ch-text2)}
.sto-donut-li i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* ★图例图标按图型变形(来源 Tooltips/图例 副本):柱=方块·折线=短线·面积=矮块·饼环=圆点 */
.sto-legend-item i.sw-bar,.sto-donut-li i.sw-bar{width:10px;height:10px;border-radius:2px}
.sto-legend-item i.sw-dot,.sto-donut-li i.sw-dot{width:10px;height:10px;border-radius:50%}
.sto-legend-item i.sw-line,.sto-donut-li i.sw-line{width:14px;height:3px;border-radius:2px}
.sto-legend-item i.sw-area,.sto-donut-li i.sw-area{width:12px;height:8px;border-radius:2px;opacity:.9}
.sto-donut-li .nm{flex:1;color:var(--ch-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sto-donut-li .pct{font-family:var(--ch-num);color:var(--ch-text3);min-width:42px;text-align:right}
.sto-donut-li .val{font-family:var(--ch-num);color:var(--ch-text);font-weight:600;min-width:60px;text-align:right}

/* ══════════ 雷达图 ══════════ */
.sto-radar-body{display:flex;justify-content:center}

/* ══════════ Tooltip ══════════ */
.sto-tooltip{display:inline-block;padding:10px 14px;border-radius:8px;font-family:var(--ch-font);min-width:176px;vertical-align:top}
.sto-tooltip--light{background:#fff;border:1px solid #E4E6EB;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.sto-tooltip--dark{background:#1C2029;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sto-tt-title{font-size:12px;color:var(--ch-text3);margin-bottom:6px}
.sto-tooltip--dark .sto-tt-title{color:rgba(255,255,255,.55)}
.sto-tt-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.sto-tt-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.sto-tt-label{font-size:12px;color:var(--ch-text2)}
.sto-tooltip--dark .sto-tt-label{color:rgba(255,255,255,.7)}
.sto-tt-value{font-family:var(--ch-num);font-size:14px;font-weight:600;color:var(--ch-title);margin-left:auto}
.sto-tooltip--dark .sto-tt-value{color:#fff}
.sto-tt-pct{font-family:var(--ch-num);font-size:12px;color:var(--ch-text3);min-width:36px;text-align:right}

/* ══════════ 中国地图热力图 Choropleth (来源:容器 1595.pdf) ══════════ */
.sto-geo-svg{display:block;width:100%;height:auto;max-height:460px;overflow:visible}
.sto-geo__prov{stroke:#fff;stroke-width:.8;stroke-linejoin:round;transition:filter .15s;cursor:default}
.sto-geo__prov:hover{filter:brightness(.92)}
.sto-geo__prov.is-empty{fill:var(--ch-bg-soft)}            /* 无数据=浅灰 */
.sto-geo-legend{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11px;color:var(--ch-text3);font-family:var(--ch-num)}
.sto-geo-legend .ramp{height:8px;width:128px;border-radius:4px}
.sto-geo-legend .na{display:inline-flex;align-items:center;gap:5px}
.sto-geo-legend .na i{width:12px;height:8px;border-radius:2px;background:var(--ch-bg-soft);border:1px solid var(--ch-line)}

/* ══════════ 漏斗图 Funnel (来源:流量图.pdf) ══════════ */
.sto-funnel-svg{display:block;width:100%;height:auto;overflow:visible}
</style>
</head>

<div class="sto-chart" style="margin-top:16px">
  <div class="sto-chart-head"><span class="sto-chart-title">Tooltip 提示（两种主题）</span></div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;background:var(--ch-bg-soft);padding:20px;border-radius:8px">
    <div id="demo-tt-light"></div>
    <div id="demo-tt-dark"></div>
  </div>
</div>

<script>
/* ============================================================
   STO Charts — 数据驱动 SVG 图表库
   公开函数：stoLine(step/smooth) / stoArea(stacked) / stoColumn(stacked) / stoCombo(柱+折线/帕累托) / stoBar(grouped/stacked) / stoDonut / stoPie / stoRadar / stoBubble / stoMap(中国省级热力,data 按省 code 或中文名) / stoFunnel(漏斗,items[{name,value,unit}]) / stoTooltip
   每个函数签名：stoX(挂载选择器或元素, 配置对象)
   ============================================================ */
(function(global){
  const SET1=['#FF6700','#005BE5','#20B87C','#FFB12E','#9480FF','#FF4D4D','#89BE12'];
  const SET2=['#F9D9C4','#D6DBFF','#D9ECE4','#F9D18F','#C2B9F9','#FAD4D4','#D6E4BA'];
  const C={grid:'#ECECEC',axis:'#D8D8D8',text:'#333333',text2:'#585858',text3:'#868F9C',title:'#1C2029'};
  // 按系列数取色：先 Set1（A1→G1）用完接 Set2
  function palette(n){const all=SET1.concat(SET2);const o=[];for(let i=0;i<n;i++)o.push(all[i]||SET1[i%7]);return o;}
  const $=s=>typeof s==='string'?document.querySelector(s):s;
  const fmt=n=>(typeof n==='number'?n.toLocaleString('zh-CN'):n);
  // 轴刻度：返回 {min,max,ticks[]}
  function scale(vals,forceZero){
    let min=Math.min(...vals),max=Math.max(...vals);
    if(forceZero) min=Math.min(0,min);
    if(min===max){max=min+1;}
    const span=max-min, step=niceStep(span/4);
    min=Math.floor(min/step)*step; max=Math.ceil(max/step)*step;
    const ticks=[];for(let v=min;v<=max+1e-9;v+=step)ticks.push(+v.toFixed(6));
    return {min,max,ticks};
  }
  function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;
    return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
  function smoothPath(pts){ // Catmull-Rom → 三次贝塞尔
    if(pts.length<2)return '';
    let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
      const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
      d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
    return d;
  }
  function linePath(pts){return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');}
  function stepPath(pts){let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(let i=1;i<pts.length;i++){d+=' L'+pts[i][0].toFixed(1)+' '+pts[i-1][1].toFixed(1)+' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);}return d;}
  function lgSwatch(c,t){return '<i class="sw-'+(t||'bar')+'" style="background:'+c+'"></i>';}
  function shell(cfg,svg,legendSeries){
    var _lt=cfg._lt||'bar';
    const head='<div class="sto-chart-head"><span class="sto-chart-title">'+(cfg.title||'')+'</span>'
      +(cfg.sub?'<span class="sto-chart-sub">'+cfg.sub+'</span>':'')+'</div>';
    let legend='';
    if(legendSeries&&legendSeries.length>1||cfg.legend){legend='<div class="sto-legend">'+
      legendSeries.map(s=>'<span class="sto-legend-item">'+lgSwatch(s.color,s._lt||_lt)+s.name+'</span>').join('')+'</div>';}
    return '<div class="sto-chart">'+head+svg+legend+'</div>';
  }

  // ── 折线图 / 面积图共用核心 ──
  function xyChart(mount,cfg,area){cfg._lt=area?'area':'line';
    const W=640,H=300,pad={l:48,r:16,t:20,b:34};
    const cats=cfg.categories, series=cfg.series.map((s,i)=>({...s,color:s.color||palette(cfg.series.length)[i]}));
    const stacked=area&&cfg.stacked;
    const pathFn=cfg.step?stepPath:(cfg.smooth===false?linePath:smoothPath);   // 默认平滑圆润(对齐 example-sto 趋势);smooth:false 取直线、step:true 取阶梯
    const all=stacked?cats.map((_,i)=>series.reduce((a,s)=>a+s.data[i],0)):[].concat(...series.map(s=>s.data));
    const sc=scale(all,true);
    const X=i=>pad.l+(cats.length<2?0:i/(cats.length-1)*(W-pad.l-pad.r));
    const Y=v=>H-pad.b-(v-sc.min)/(sc.max-sc.min)*(H-pad.t-pad.b);
    let g='';
    sc.ticks.forEach(t=>{const y=Y(t).toFixed(1);
      g+='<line class="sto-ax-grid" x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'"/>';
      g+='<text class="sto-ax-text num" x="'+(pad.l-8)+'" y="'+(+y+4)+'" text-anchor="end">'+fmt(t)+'</text>';});
    cats.forEach((c,i)=>{g+='<text class="sto-ax-text" x="'+X(i).toFixed(1)+'" y="'+(H-pad.b+18)+'" text-anchor="middle">'+c+'</text>';});
    let defs='',body='';
    if(stacked){let base=cats.map(()=>0);
      series.forEach(s=>{const top=base.map((b,i)=>b+s.data[i]);
        const topPts=top.map((v,i)=>[X(i),Y(v)]),basePts=base.map((v,i)=>[X(i),Y(v)]);
        let d=pathFn(topPts);for(let i=basePts.length-1;i>=0;i--)d+=' L'+basePts[i][0].toFixed(1)+' '+basePts[i][1].toFixed(1);d+=' Z';
        body+='<path d="'+d+'" fill="'+hexA(s.color,.8)+'"/><path class="sto-line" d="'+pathFn(topPts)+'" stroke="'+s.color+'"/>';
        base=top;});
    }else series.forEach(s=>{
      const pts=s.data.map((v,i)=>[X(i),Y(v)]);
      const d=pathFn(pts);
      if(area){const gid='stoag'+Math.random().toString(36).slice(2,7);
        defs+='<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.color+'" stop-opacity=".25"/><stop offset="100%" stop-color="'+s.color+'" stop-opacity=".02"/></linearGradient>';
        body+='<path d="'+d+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-pad.b)+' L'+pts[0][0].toFixed(1)+' '+(H-pad.b)+' Z" fill="url(#'+gid+')"/>';}
      body+='<path class="sto-line" d="'+d+'" stroke="'+s.color+'"/>';
      if(!cfg.step)pts.forEach(p=>{body+='<circle class="sto-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+s.color+'"/>';});
    });
    const svg='<svg viewBox="0 0 '+W+' '+H+'"><defs>'+defs+'</defs>'+g+body+'</svg>';
    $(mount).innerHTML=shell(cfg,svg,series);
  }
  function stoLine(mount,cfg){xyChart(mount,cfg,false);}
  function stoArea(mount,cfg){xyChart(mount,cfg,true);}

  // ── 柱状图（分组 / 堆叠）──
  function stoColumn(mount,cfg){cfg._lt='bar';
    const W=640,H=300,pad={l:48,r:16,t:24,b:34};
    const cats=cfg.categories, series=cfg.series.map((s,i)=>({...s,color:s.color||palette(cfg.series.length)[i]}));
    const stacked=!!cfg.stacked;
    let maxV;
    if(stacked){maxV=Math.max(...cats.map((_,i)=>series.reduce((a,s)=>a+s.data[i],0)));}
    else{maxV=Math.max(...[].concat(...series.map(s=>s.data)));}
    const sc=scale([0,maxV],true);
    const Y=v=>H-pad.b-(v-sc.min)/(sc.max-sc.min)*(H-pad.t-pad.b);
    const band=(W-pad.l-pad.r)/cats.length, bw=Math.min(band*0.62, stacked?44:60);
    let g='';
    sc.ticks.forEach(t=>{const y=Y(t).toFixed(1);
      g+='<line class="sto-ax-grid" x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'"/>';
      g+='<text class="sto-ax-text num" x="'+(pad.l-8)+'" y="'+(+y+4)+'" text-anchor="end">'+fmt(t)+'</text>';});
    let body='';
    cats.forEach((c,i)=>{
      const cx=pad.l+band*i+band/2;
      g+='<text class="sto-ax-text" x="'+cx.toFixed(1)+'" y="'+(H-pad.b+18)+'" text-anchor="middle">'+c+'</text>';
      if(stacked){let acc=0;
        series.forEach(s=>{const h=(s.data[i])/(sc.max-sc.min)*(H-pad.t-pad.b);const y=Y(acc+s.data[i]);
          body+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+s.color+'"/>';acc+=s.data[i];});
      }else{const gw=bw, per=series.length, sub=gw/per;
        series.forEach((s,si)=>{const h=(s.data[i])/(sc.max-sc.min)*(H-pad.t-pad.b);const x=cx-gw/2+sub*si;const y=Y(s.data[i]);
          body+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(sub-3).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+s.color+'"/>';
          if(per===1)body+='<text class="sto-val-text" x="'+(x+(sub-3)/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+fmt(s.data[i])+'</text>';});}
    });
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'+g+body+'</svg>';
    $(mount).innerHTML=shell(cfg,svg,series);
  }

  // ── 组合图（柱 + 折线 / 帕累托）：蓝柱 + 橙线,共用一轴 ──
  function stoCombo(mount,cfg){
    const W=640,H=300,pad={l:48,r:16,t:24,b:34};
    const cats=cfg.categories;
    const bar=Object.assign({color:'#005BE5',name:'柱'},cfg.bars);
    const line=Object.assign({color:'#FF6700',name:'线'},cfg.line);
    const sc=scale([0,Math.max(...bar.data,...line.data)],true);
    const Y=v=>H-pad.b-(v-sc.min)/(sc.max-sc.min)*(H-pad.t-pad.b);
    const band=(W-pad.l-pad.r)/cats.length, bw=Math.min(band*0.5,38);
    let g='';sc.ticks.forEach(t=>{const y=Y(t).toFixed(1);
      g+='<line class="sto-ax-grid" x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'"/>';
      g+='<text class="sto-ax-text num" x="'+(pad.l-8)+'" y="'+(+y+4)+'" text-anchor="end">'+fmt(t)+'</text>';});
    let body='';
    cats.forEach((c,i)=>{const cx=pad.l+band*i+band/2;
      g+='<text class="sto-ax-text" x="'+cx.toFixed(1)+'" y="'+(H-pad.b+18)+'" text-anchor="middle">'+c+'</text>';
      const h=bar.data[i]/(sc.max-sc.min)*(H-pad.t-pad.b);
      body+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(bar.data[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+bar.color+'"/>';});
    const lpts=line.data.map((v,i)=>[pad.l+band*i+band/2,Y(v)]);
    body+='<path class="sto-line" d="'+linePath(lpts)+'" stroke="'+line.color+'"/>';
    lpts.forEach(p=>body+='<circle class="sto-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+line.color+'"/>');
    $(mount).innerHTML=shell(cfg,'<svg viewBox="0 0 '+W+' '+H+'">'+g+body+'</svg>',[{name:bar.name,color:bar.color,_lt:'bar'},{name:line.name,color:line.color,_lt:'line'}]);
  }

  // ── 条形图（横向：单系列 items；多系列 series 走分组/堆叠）──
  function stoBar(mount,cfg){
    if(cfg.series)return stoBarMulti(mount,cfg);
    const items=cfg.items.map((it,i)=>({...it,color:it.color||palette(cfg.items.length)[i]}));
    const W=560, rowH=34, pad={l:96,r:96,t:8,b:8};
    const H=pad.t+pad.b+items.length*rowH;
    const maxV=Math.max(...items.map(d=>d.value));
    const bw=W-pad.l-pad.r;
    let body='';
    items.forEach((it,i)=>{const y=pad.t+i*rowH+6, h=rowH-14, w=it.value/maxV*bw;
      body+='<text class="sto-ax-text" x="'+(pad.l-10)+'" y="'+(y+h/2+4)+'" text-anchor="end" style="fill:'+C.text+';font-size:13px">'+it.label+'</text>';
      body+='<rect x="'+pad.l+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+h+'" rx="4" fill="'+it.color+'"/>';
      const vt=fmt(it.value)+(it.pct?' ('+it.pct+')':'');
      body+='<text class="sto-val-text" x="'+(pad.l+w+8).toFixed(1)+'" y="'+(y+h/2+4)+'" style="fill:'+C.text2+'">'+vt+'</text>';});
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'+body+'</svg>';
    $(mount).innerHTML=shell(cfg,svg,[]);
  }
  // 分组 / 堆叠条形图(多系列横向)
  function stoBarMulti(mount,cfg){cfg._lt='bar';
    const cats=cfg.categories, series=cfg.series.map((s,i)=>({...s,color:s.color||palette(cfg.series.length)[i]}));
    const stacked=!!cfg.stacked, W=560, rowH=stacked?32:16*series.length+18, pad={l:96,r:48,t:8,b:8};
    const H=pad.t+pad.b+cats.length*rowH, bw=W-pad.l-pad.r;
    const maxV=stacked?Math.max(...cats.map((_,i)=>series.reduce((a,s)=>a+s.data[i],0))):Math.max(...[].concat(...series.map(s=>s.data)));
    let body='';
    cats.forEach((c,i)=>{const y0=pad.t+i*rowH;
      body+='<text class="sto-ax-text" x="'+(pad.l-10)+'" y="'+(y0+rowH/2+4).toFixed(1)+'" text-anchor="end" style="fill:'+C.text+';font-size:13px">'+c+'</text>';
      if(stacked){let acc=0;const h=rowH-14;
        series.forEach(s=>{const w=s.data[i]/maxV*bw;body+='<rect x="'+(pad.l+acc/maxV*bw).toFixed(1)+'" y="'+(y0+7)+'" width="'+w.toFixed(1)+'" height="'+h+'" fill="'+s.color+'"/>';acc+=s.data[i];});}
      else{const sh=(rowH-10)/series.length-2;
        series.forEach((s,si)=>{const w=s.data[i]/maxV*bw,yy=y0+5+si*(sh+2);
          body+='<rect x="'+pad.l+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+sh.toFixed(1)+'" rx="3" fill="'+s.color+'"/>';});}
    });
    $(mount).innerHTML=shell(cfg,'<svg viewBox="0 0 '+W+' '+H+'">'+body+'</svg>',series);
  }

  // ── 环形图 ──
  function stoDonut(mount,cfg){
    const items=cfg.items.map((it,i)=>({...it,color:it.color||palette(cfg.items.length)[i]}));
    const total=cfg.total!=null?cfg.total:items.reduce((a,b)=>a+b.value,0);
    const cx=84,cy=84,R=78,r2=cfg.pie?0:R*0.62, gap=cfg.pie?0:0.03;   /* pie:true → 实心饼图 */
    let a0=-Math.PI/2, body='';
    const P=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
    items.forEach(it=>{const frac=it.value/total; let a1=a0+frac*Math.PI*2;
      const s=a0+gap/2, e=a1-gap/2, large=(e-s)>Math.PI?1:0;
      const [x0,y0]=P(R,s),[x1,y1]=P(R,e),[x2,y2]=P(r2,e),[x3,y3]=P(r2,s);
      body+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)
        +' L'+x2.toFixed(1)+' '+y2.toFixed(1)+' A'+r2+' '+r2+' 0 '+large+' 0 '+x3.toFixed(1)+' '+y3.toFixed(1)+' Z" fill="'+it.color+'"/>';
      a0=a1;});
    if(!cfg.pie){
      body+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" style="font-family:var(--ch-num);font-size:22px;font-weight:600;fill:'+C.title+'">'+fmt(total)+'</text>';
      body+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" style="font-family:var(--ch-font);font-size:12px;fill:'+C.text3+'">'+(cfg.centerLabel||'总计')+'</text>';}
    const legend=items.map(it=>'<div class="sto-donut-li"><i class="sw-dot" style="background:'+it.color+'"></i><span class="nm">'+it.name+'</span>'
      +'<span class="pct">'+(it.value/total*100).toFixed(1)+'%</span><span class="val">'+fmt(it.value)+'</span></div>').join('');
    const head='<div class="sto-chart-head"><span class="sto-chart-title">'+(cfg.title||'')+'</span></div>';
    $(mount).innerHTML='<div class="sto-chart">'+head+'<div class="sto-donut-body">'
      +'<svg class="sto-donut-svg" viewBox="0 0 168 168">'+body+'</svg>'
      +'<div class="sto-donut-legend">'+legend+'</div></div></div>';
  }

  // ── 雷达图 ──
  function stoRadar(mount,cfg){
    const axes=cfg.axes, series=cfg.series.map((s,i)=>({...s,color:s.color||palette(cfg.series.length)[i]}));
    const W=320,H=300,cx=W/2,cy=150,R=104,layers=4,n=axes.length;
    const maxV=cfg.max||Math.max(...[].concat(...series.map(s=>s.data)))*1.1;
    const ang=i=>-Math.PI/2+i/n*Math.PI*2;
    const P=(i,rad)=>[cx+rad*Math.cos(ang(i)),cy+rad*Math.sin(ang(i))];
    let g='';
    for(let l=1;l<=layers;l++){const rr=R*l/layers;
      g+='<polygon class="sto-ax-grid" fill="none" points="'+axes.map((_,i)=>P(i,rr).map(v=>v.toFixed(1)).join(',')).join(' ')+'"/>';}
    axes.forEach((_,i)=>{const[x,y]=P(i,R);g+='<line class="sto-ax-line" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';});
    axes.forEach((a,i)=>{const[x,y]=P(i,R+16);g+='<text class="sto-ax-text" x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" style="fill:'+C.text2+'">'+a+'</text>';});
    let body='';
    series.forEach(s=>{const pts=s.data.map((v,i)=>P(i,R*v/maxV));
      body+='<polygon fill="'+hexA(s.color,.15)+'" stroke="'+s.color+'" stroke-width="2" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';
      pts.forEach(p=>{body+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+s.color+'"/>';});});
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'+g+body+'</svg>';
    const head='<div class="sto-chart-head"><span class="sto-chart-title">'+(cfg.title||'')+'</span></div>';
    let legend='';if(series.length>1)legend='<div class="sto-legend">'+series.map(s=>'<span class="sto-legend-item"><i class="sw-line" style="background:'+s.color+'"></i>'+s.name+'</span>').join('')+'</div>';
    $(mount).innerHTML='<div class="sto-chart">'+head+'<div class="sto-radar-body">'+svg+'</div>'+legend+'</div>';
  }

  // ── 气泡图 ──
  function stoBubble(mount,cfg){
    const W=560,H=300,pad={l:48,r:20,t:20,b:34};
    const pts=cfg.points;const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),rs=pts.map(p=>p.r);
    const sx=scale(xs,true),sy=scale(ys,true),rmin=Math.min(...rs),rmax=Math.max(...rs);
    const X=v=>pad.l+(v-sx.min)/(sx.max-sx.min)*(W-pad.l-pad.r);
    const Y=v=>H-pad.b-(v-sy.min)/(sy.max-sy.min)*(H-pad.t-pad.b);
    const R=v=>8+(rmax===rmin?16:(v-rmin)/(rmax-rmin)*32);
    let g='';
    sy.ticks.forEach(t=>{const y=Y(t).toFixed(1);g+='<line class="sto-ax-grid" x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'"/>';
      g+='<text class="sto-ax-text num" x="'+(pad.l-8)+'" y="'+(+y+4)+'" text-anchor="end">'+fmt(t)+'</text>';});
    const cols=palette(pts.length);
    let body='';pts.forEach((p,i)=>{body+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+R(p.r).toFixed(1)+'" fill="'+(p.color||cols[i])+'" opacity="0.8"/>';
      if(p.label)body+='<text class="sto-ax-text" x="'+X(p.x).toFixed(1)+'" y="'+Y(p.y).toFixed(1)+'" text-anchor="middle" style="fill:#fff;font-size:11px">'+p.label+'</text>';});
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'+g+body+'</svg>';
    $(mount).innerHTML=shell(cfg,svg,[]);
  }

  // ── Tooltip（静态片段生成）──
  function stoTooltip(cfg){
    const theme=cfg.theme==='dark'?'sto-tooltip--dark':'sto-tooltip--light';
    const rows=cfg.rows.map(r=>'<div class="sto-tt-row"><i class="sto-tt-dot" style="background:'+r.color+'"></i>'
      +'<span class="sto-tt-label">'+r.label+'</span><span class="sto-tt-value">'+fmt(r.value)+'</span>'
      +(r.pct?'<span class="sto-tt-pct">'+r.pct+'</span>':'')+'</div>').join('');
    return '<div class="sto-tooltip '+theme+'">'+(cfg.title?'<div class="sto-tt-title">'+cfg.title+'</div>':'')+rows+'</div>';
  }

  // ── 中国地图热力图（来源:容器 1595.pdf）──
  // CN_GEO 见上方常量。数据可用省 code(CNSC) 或中文名(四川)。
  const CN_N2C=(()=>{const m={};for(const k in CN_GEO)m[CN_GEO[k].n]=k;return m;})();
  function mixHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
    const ra=pa>>16&255,ga=pa>>8&255,ba=pa&255,rb=pb>>16&255,gb=pb>>8&255,bb=pb&255;
    const r=Math.round(ra+(rb-ra)*t),g=Math.round(ga+(gb-ga)*t),bl=Math.round(ba+(bb-ba)*t);
    return '#'+(1<<24|r<<16|g<<8|bl).toString(16).slice(1);}
  function stoMap(mount,cfg){
    const data=cfg.data||{}, vals={};
    for(const k in data){const code=CN_GEO[k]?k:CN_N2C[k]; if(code)vals[code]=data[k];}
    const nums=Object.values(vals).filter(v=>typeof v==='number');
    const max=cfg.max!=null?cfg.max:(nums.length?Math.max(...nums):1);
    const min=cfg.min!=null?cfg.min:0;
    const ramp=cfg.ramp||['#FFE7D6','#FF6700'];   /* 浅橙→品牌橙;无数据走 .is-empty 灰 */
    let body='';
    for(const code in CN_GEO){
      const v=vals[code], has=typeof v==='number';
      const t=max===min?1:(v-min)/(max-min);
      const fill=has?mixHex(ramp[0],ramp[1],Math.max(0,Math.min(1,t))):'';
      body+='<path class="sto-geo__prov'+(has?'':' is-empty')+'" data-prov="'+code+'"'
        +(has?' style="fill:'+fill+'"':'')+' d="'+CN_GEO[code].d+'">'
        +'<title>'+CN_GEO[code].n+'：'+(has?fmt(v)+(cfg.unit||''):'无数据')+'</title></path>';
    }
    const svg='<svg class="sto-geo-svg" viewBox="0 0 1000 738">'+body+'</svg>';
    const legend='<div class="sto-geo-legend"><span>'+fmt(min)+'</span>'
      +'<span class="ramp" style="background:linear-gradient(90deg,'+ramp[0]+','+ramp[1]+')"></span>'
      +'<span>'+fmt(max)+(cfg.unit||'')+'</span>'
      +'<span class="na"><i></i>无数据</span></div>';
    const head='<div class="sto-chart-head"><span class="sto-chart-title">'+(cfg.title||'')+'</span>'
      +(cfg.sub?'<span class="sto-chart-sub">'+cfg.sub+'</span>':'')+'</div>';
    $(mount).innerHTML='<div class="sto-chart">'+head+svg+legend+'</div>';
  }

  // ── 漏斗图（来源:流量图.pdf）──
  function stoFunnel(mount,cfg){
    const FP=['#FF4D4D','#FF8A1E','#FFB12E','#20B87C','#5B7CFA','#9480FF','#FF6700'];  /* 分类色,对齐 PDF 红橙黄绿蓝 */
    const items=cfg.items.map((it,i)=>({...it,color:it.color||FP[i%FP.length]}));
    const max=Math.max(...items.map(it=>it.value))||1;
    const W=560,labW=92,padR=10,rowH=44,gap=14;
    const innerW=W-labW-padR;
    const H=items.length*rowH+(items.length-1)*gap;
    let body='';
    items.forEach((it,i)=>{
      const w=Math.max(10,it.value/max*innerW), y=i*(rowH+gap);
      if(i<items.length-1){const w2=Math.max(10,items[i+1].value/max*innerW),y2=y+rowH,yb=y2+gap;
        body+='<path d="M'+labW+' '+y2+'L'+(labW+w)+' '+y2+'L'+(labW+w2)+' '+yb+'L'+labW+' '+yb+'Z" fill="'+hexA(it.color,.08)+'"/>';}
      body+='<rect x="'+labW+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+rowH+'" rx="3" fill="'+hexA(it.color,.22)+'"/>';
      body+='<rect x="'+labW+'" y="'+y+'" width="4" height="'+rowH+'" rx="2" fill="'+it.color+'"/>';
      body+='<text x="0" y="'+(y+17)+'" style="font-family:var(--ch-font);font-size:12px;fill:'+C.text3+'">'+it.name+'</text>';
      body+='<text x="0" y="'+(y+38)+'" style="font-family:var(--ch-num);font-size:18px;font-weight:600;fill:'+C.title+'">'+fmt(it.value)
        +(it.unit?'<tspan dx="3" style="font-size:11px;font-weight:400;fill:'+C.text3+'">'+it.unit+'</tspan>':'')+'</text>';
    });
    const svg='<svg class="sto-funnel-svg" viewBox="0 0 '+W+' '+H+'">'+body+'</svg>';
    $(mount).innerHTML=shell(cfg,svg,[]);
  }


  function stoPie(mount,cfg){stoDonut(mount,Object.assign({},cfg,{pie:true}));}
  Object.assign(global,{stoLine,stoArea,stoColumn,stoCombo,stoBar,stoDonut,stoPie,stoRadar,stoBubble,stoTooltip,stoMap,stoFunnel,stoPalette:palette});
})(window);
