<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100">
 <defs>
 <marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/></marker>
 <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/></marker>
 <marker id="ao" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#ea580c"/></marker>
 <marker id="ap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#9333ea"/></marker>
 <marker id="agy" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/></marker>
 <style>
 .t{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif}
 .title{font-size:18px;font-weight:600;fill:#111827}
 .sec{font-size:12px;font-weight:600;fill:#374151}
 .actor{font-size:13px;font-weight:600;fill:#111827}
 .asub{font-size:10px;fill:#6b7280}
 .msg{font-size:11px;fill:#374151}
 .note{font-size:11px;fill:#6b7280}
 .leg{font-size:11px;fill:#4b5563}
 </style>
 </defs>
 <rect width="1000" height="1100" fill="#ffffff"/>
 <text class="t title" x="36" y="28">钉钉 Channel · 三场景合一（三端时序）</text>
 <text class="t note" x="36" y="46">橙线 = 复用智多星既有钉钉链路；其余颜色 = Channel Plane 新增能力</text>
 <rect x="36" y="58" width="928" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
 <line x1="56" y1="76" x2="90" y2="76" stroke="#ea580c" stroke-width="2.2" marker-end="url(#ao)"/>
 <text class="t leg" x="98" y="80">智多星既有（Stream / 卡片 / H5 免登）</text>
 <line x1="310" y1="76" x2="344" y2="76" stroke="#9333ea" stroke-width="2" marker-end="url(#ap)"/>
 <text class="t leg" x="352" y="80">扫码绑定 / 换机 claim</text>
 <line x1="520" y1="76" x2="554" y2="76" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
 <text class="t leg" x="562" y="80">Hub↔本地 WS / 本机执行</text>
 <line x1="740" y1="76" x2="774" y2="76" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
 <text class="t leg" x="782" y="80">本地流式回程</text>
 <rect x="98" y="108" width="144" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
 <text class="t actor" x="170" y="126" text-anchor="middle">本地端</text>
 <text class="t asub" x="170" y="142" text-anchor="middle">StoClaw Desktop</text>
 <rect x="428" y="108" width="144" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
 <text class="t actor" x="500" y="126" text-anchor="middle">智多星 WS 服务端</text>
 <text class="t asub" x="500" y="142" text-anchor="middle">Channel Hub</text>
 <rect x="758" y="108" width="144" height="44" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
 <text class="t actor" x="830" y="126" text-anchor="middle">钉钉机器人端</text>
 <text class="t asub" x="830" y="142" text-anchor="middle">Stream / 卡片 / H5</text>
 <line x1="170" y1="156" x2="170" y2="1020" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,3"/>
 <line x1="500" y1="156" x2="500" y2="1020" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,3"/>
 <line x1="830" y1="156" x2="830" y2="1020" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,3"/>
 <rect x="40" y="168" width="200" height="22" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
 <text class="t sec" x="50" y="183">场景一 · 扫码绑定</text>
 <line x1="170" y1="200" x2="500" y2="200" stroke="#9333ea" stroke-width="1.6" fill="none" marker-end="url(#ap)"/>
 <rect x="255.0" y="186" width="160.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="196" text-anchor="middle">1. create(deviceId) 申请绑定码</text>
 <line x1="500" y1="224" x2="170" y2="224" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="4,2" fill="none" marker-end="url(#ap)"/>
 <rect x="267.0" y="210" width="136.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="220" text-anchor="middle">2. 返回 bindToken / 二维码</text>
 <line x1="830" y1="248" x2="500" y2="248" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
 <rect x="585.0" y="234" width="160.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="665.0" y="244" text-anchor="middle">3. 钉钉扫码 · H5 免登确认（复用钉钉能力）</text>
 <path d="M500,272 L544,272 L544,286 L500,286" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
 <text class="t msg" x="550" y="283" text-anchor="start">4. 签发 ticket</text>
 <line x1="170" y1="302" x2="500" y2="302" stroke="#9333ea" stroke-width="1.6" fill="none" marker-end="url(#ap)"/>
 <rect x="261.0" y="288" width="148.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="298" text-anchor="middle">5. poll / claim(ticket)</text>
 <path d="M500,326 L544,326 L544,340 L500,340" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
 <text class="t msg" x="550" y="337" text-anchor="start">6. activateBind 落库 · 发 refreshToken</text>
 <line x1="500" y1="356" x2="170" y2="356" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="4,2" fill="none" marker-end="url(#ap)"/>
 <rect x="276.0" y="342" width="118.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="352" text-anchor="middle">7. 返回 refreshToken</text>
 <line x1="170" y1="380" x2="500" y2="380" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
 <rect x="282.0" y="366" width="106.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="376" text-anchor="middle">8. 建立 WS 长连接</text>
 <rect x="40" y="412" width="200" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
 <text class="t sec" x="50" y="427">场景二 · 日常对话</text>
 <line x1="830" y1="444" x2="500" y2="444" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
 <rect x="588.0" y="430" width="154.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="665.0" y="440" text-anchor="middle">1. Stream 入站（智多星既有机器人链路）</text>
 <path d="M500,468 L456,468 L456,482 L500,482" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
 <text class="t msg" x="450" y="479" text-anchor="end">2. dingUserId → bound.deviceId</text>
 <line x1="500" y1="498" x2="170" y2="498" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
 <rect x="267.0" y="484" width="136.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="494" text-anchor="middle">3. WS 推送 inbound</text>
 <path d="M170,522 L214,522 L214,536 L170,536" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
 <text class="t msg" x="220" y="533" text-anchor="start">4. SessionFacade → 双引擎</text>
 <line x1="170" y1="552" x2="500" y2="552" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
 <rect x="255.0" y="538" width="160.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="548" text-anchor="middle">5. 流式回程 delta / done</text>
 <line x1="500" y1="576" x2="830" y2="576" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
 <rect x="600.0" y="562" width="130.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="665.0" y="572" text-anchor="middle">6. 卡片流式更新回钉钉（智多星既有）</text>
 <rect x="40" y="608" width="200" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
 <text class="t sec" x="50" y="623">场景三 · 换机（A→B）</text>
 <line x1="170" y1="640" x2="500" y2="640" stroke="#9333ea" stroke-width="1.6" fill="none" marker-end="url(#ap)"/>
 <rect x="282.0" y="626" width="106.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="636" text-anchor="middle">1. 【B】create 出码</text>
 <line x1="830" y1="664" x2="500" y2="664" stroke="#ea580c" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
 <rect x="594.0" y="650" width="142.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="665.0" y="660" text-anchor="middle">2. 同一用户扫码确认（复用 H5 免登）</text>
 <line x1="170" y1="688" x2="500" y2="688" stroke="#9333ea" stroke-width="1.6" fill="none" marker-end="url(#ap)"/>
 <rect x="294.0" y="674" width="82.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="684" text-anchor="middle">3. 【B】claim</text>
 <path d="M500,712 L544,712 L544,726 L500,726" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
 <text class="t msg" x="550" y="723" text-anchor="start">4. 废 A · 启 B · 记 oldDeviceId</text>
 <line x1="500" y1="742" x2="170" y2="742" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
 <rect x="243.0" y="728" width="184.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="738" text-anchor="middle">5. 【A】kick：bind.replaced</text>
 <path d="M170,766 L214,766 L214,780 L170,780" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
 <text class="t msg" x="220" y="777" text-anchor="start">6. 【A】本地 revoke · 频道条目提示</text>
 <line x1="500" y1="796" x2="170" y2="796" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4,2" fill="none" marker-end="url(#ab)"/>
 <rect x="249.0" y="782" width="172.0" height="13" rx="2" fill="#ffffff" opacity="0.95"/>
 <text class="t msg" x="335.0" y="792" text-anchor="middle">7. 【B】新 refreshToken 并连 WS</text>
 <text class="t note" x="40" y="830">说明：橙线复用智多星既有钉钉入站/回程/H5；紫=绑定换机；蓝=Hub↔本地 WS 与本机执行；绿=本地流式上行。踢人 key=A.deviceId。</text>
 <rect x="98" y="850" width="144" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
 <text class="t actor" x="170" y="868" text-anchor="middle">本地端</text>
 <text class="t asub" x="170" y="884" text-anchor="middle">StoClaw Desktop</text>
 <rect x="428" y="850" width="144" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
 <text class="t actor" x="500" y="868" text-anchor="middle">智多星 WS 服务端</text>
 <text class="t asub" x="500" y="884" text-anchor="middle">Channel Hub</text>
 <rect x="758" y="850" width="144" height="44" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
 <text class="t actor" x="830" y="868" text-anchor="middle">钉钉机器人端</text>
 <text class="t asub" x="830" y="884" text-anchor="middle">Stream / 卡片 / H5</text>
</svg>